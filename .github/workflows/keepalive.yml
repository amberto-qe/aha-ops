name: keepalive

# GitHub auto-disables scheduled workflows after 60 days of no repository
# activity. patrol-run pushes to GHCR but never commits here, so the repo would
# otherwise go idle and the */5 schedule would be disabled (exactly what killed
# the original on ahapeter/aha-ops). This commits a weekly heartbeat to reset
# that clock, replacing the old Supabase pg_cron trigger.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (offset from :00 to avoid dropped runs)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive heartbeat [skip ci]" || { echo "no change"; exit 0; }
          git push
